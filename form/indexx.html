<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="stylesheet" href="stylee.css">
</head>
<body>
  <div class="contact-container">
    <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
      <div class="contact-left-title">
        <h2>Get in touch</h2>
        <hr>
      </div>
        <input type="hidden" name="access_key" value="aae187ef-e7c7-4398-9eab-5c9173a6fcc2">
      <!-- Corrected class names -->
      <input type="hidden" name="subject" value="New message from your portfolio">
      <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
      <input type="email" name="email" placeholder="Your Email" class="contact-inputs" required>

      <textarea name="message" placeholder="Your Message" class="contact-left-textarea" required></textarea>
      <button type="submit">
        Send <img src="512_form_img/assets/arrow_icon.png" alt="">
      </button>
    </form>

    <div class="contact-right">
      <img src="512_form_img/assets/right_img.png" alt="">
    </div>
  </div>
</body>
</html>
